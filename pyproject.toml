[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "subot"
version = "0.1.0"
description = "A Subito.it watcher that sends new listings to ntfy"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "curl-cffi>=0.16.0",
]

[tool.setuptools]
py-modules = ["subot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
